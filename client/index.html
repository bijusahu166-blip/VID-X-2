<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <link rel="icon" type="image/png" href="/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Architects+Daughter..." rel="stylesheet">
    <script>
      window.onerror = function(msg, url, line, col, error) {
        document.body.innerHTML = '<div style="background:red;color:white;padding:20px;font-family:monospace;font-size:14px;white-space:pre-wrap;">' +
          'ERROR: ' + msg + '\n\nFile: ' + url + '\nLine: ' + line + '\n\n' + (error && error.stack ? error.stack : '') +
          '</div>';
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
